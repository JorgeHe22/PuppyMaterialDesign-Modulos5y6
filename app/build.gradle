plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.puppymaterialdesign'

    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.puppymaterialdesign"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Configuración local para pruebas con JavaMail.
    // No subir local.properties al repositorio.
    def localSecrets = new Properties()
    def secretFile = rootProject.file('local.properties')

    if (secretFile.exists()) {
        secretFile.withInputStream {
            localSecrets.load(it)
        }
    }

    def esc = { v ->
        (v ?: '').replace('\\', '\\\\').replace('"', '\\"')
                .replace('\n', '\\n').replace('\r', '\\r')
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        buildConfigField 'String', 'SMTP_USER',
                '"' + esc(localSecrets.getProperty('smtp.user', '')) + '"'

        buildConfigField 'String', 'SMTP_PASS',
                '"' + esc(localSecrets.getProperty('smtp.pass', '')) + '"'

        buildConfigField 'String', 'SMTP_TO',
                '"' + esc(localSecrets.getProperty('smtp.to', '')) + '"'
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Soluciona los archivos META-INF duplicados de JavaMail.
    packaging {
        resources {
            excludes += [
                    'META-INF/NOTICE.md',
                    'META-INF/LICENSE.md'
            ]
        }
    }
}

dependencies {

    // Dependencias principales
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Listado de mascotas
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // Navegación entre Fragments
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.9'

    // Imagen circular del perfil
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // Envío de comentarios por correo electrónico
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'

    // Pruebas
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}


